name: Build WhatsApp UI Flutter App

on:
  push:
    branches: [ main ]
    paths: [ 'whatsapp_ui/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'whatsapp_ui/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.19.0
        cache: true
        
    - name: Get dependencies
      run: |
        cd whatsapp_ui
        flutter pub get
        
    - name: Analyze code
      run: |
        cd whatsapp_ui  
        flutter analyze
        
    - name: Run tests
      run: |
        cd whatsapp_ui
        flutter test
        
    - name: Build APK
      run: |
        cd whatsapp_ui
        flutter build apk --release
        
    - name: Build Web
      run: |
        cd whatsapp_ui
        flutter build web --release
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: whatsapp-ui-apk
        path: whatsapp_ui/build/app/outputs/flutter-apk/app-release.apk
        
    - name: Upload Web artifact
      uses: actions/upload-artifact@v4
      with:
        name: whatsapp-ui-web
        path: whatsapp_ui/build/web/